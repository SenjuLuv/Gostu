<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="header">
    <div class="header__wrapper">
        <div class="header__logo"> <a href="" class="logo__link"><img src="./img/svg/8liJ5im_e3Y 1.svg" alt="Gosu" class="logo__img"></a></div>
        <div class="header__items">
            <nav class="header__nav">
                    <ul class="nav__menu">
                        <li class="nav__item">
                            <a href="" class="nav__link">О нас</a>
                        </li>
                    </ul>
                    <ul class="nav__menu">
                        <li class="nav__item">
                            <a href="" class="nav__link">Зоны</a>
                        </li>
                    </ul>
                    <ul class="nav__menu">
                        <li class="nav__item">
                            <a href="" class="nav__link">Новости</a>
                        </li>
                    </ul>
                    <ul class="nav__menu">
                        <li class="nav__item">
                            <a href="" class="nav__link">Контакты</a>

                    </ul>
            </nav>
        </div>
        <div class="header_menu">

    </div>
    <div class="header__button">
        <button class="bronirovat">

        </button>
    </div>
</header>
<main class="main">
    <section class="carusel">
        <img src="./img/png/fire_1f525 1.png" alt="fire" class="fire">
        <div class="hero__title">

        </div>
        <div class="hero__carusel">
              <div class="carousel__slide">
                <img src="./img/jpg/Group 8.jpg" alt="CYBERPANK" class="corusel__img">
             </div>
              <div class="carousel__slide">
                <img src="./img/jpg/Group 3.jpg" alt="DOTA" class="corusel__img">
             </div>
              <div class="carousel__slide">
                  <img src="./img/jpg/Group 4.jpg" alt="CS" class="corusel__img">
             </div>
              <div class="carousel__slide">
                 <img src="./img/jpg/Group 5.jpg" alt="VALORANT" class="corusel__img">
             </div>
              <div class="carousel__slide">
                  <img src="./img/jpg/Group 6.jpg" alt="PUBG" class="corusel__img">
             </div>
              <div class="carousel__slide">
                  <img src="./img/jpg/Group 7.jpg" alt="LEAGUE OF LEGENDS" class="corusel__img">
             </div>
              <div class="carousel__slide">
                  <img src="./img/jpg/Group 9.jpg" alt="APEX LEGENDSK" class="corusel__img">
             </div>
        </div>
         <div class="hero__button">
            <button class="bronirovat__hero">
                <img src="./img/png/PC.png" alt="PC" class="bronirovat__img">
                <p class="bronirovat__text">ЗАБРОНИРОВАТЬ ПК</p>
            </button>
        </div>
    </section>
</main>

</html>
